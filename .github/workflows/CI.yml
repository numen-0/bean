name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.14"]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install packages
        run: pip install ./bean-*

      - name: Run tests
        run: sh run_tests.sh

  publish:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    environment: pypi

    permissions:
      id-token: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install build tools
        run: python -m pip install build

      - name: Build packages
        run: |
          rm -rf dist
          mkdir dist

          for dir in bean-*; do
            [ -f "$dir/pyproject.toml" ] || continue

            (
              cd "$dir"
              rm -rf dist
              python -m build
            )

            cp "$dir"/dist/* dist/
          done

      - name: Publish packages
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  tag:
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install packages
        run: pip install ./bean-*

      - name: Tag packages
        run: |
          for dir in bean-*; do
              module="${dir#bean-}"
          
              version="$(
                  cd "$dir"
                  python -c '
                      from bean.${module} import __version__
                      print(__version__)
                  '
              )"
         
              tag="${dir}-${version}"
          
              if git rev-parse "$tag" >/dev/null 2>&1; then
                  echo "'$tag' already exists."
                  continue
              fi
          
              echo "Pushing tag: $tag"
              git tag "$tag"
              git push origin "$tag"
          done
